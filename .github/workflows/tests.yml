name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    name: Survey pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Get project code
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        id: dependencies
        run: uv sync --locked
      # Run every group even if another group fails, provided setup succeeded.
      - name: Unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run pytest -q -s tests/unit
      - name: Integration tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run pytest -q -s tests/integration
      - name: End-to-end tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run pytest -q -s tests/e2e
