name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    name: Survey pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Get project code
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        id: dependencies
        run: uv sync
      # Run every group even if another group fails, provided setup succeeded.
      - name: Page identification
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run pytest -q -s tests/test_identify.py
      - name: PDF splitting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run pytest -q -s tests/test_split.py
      - name: Retry and recovery
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run pytest -q -s tests/test_run.py
      - name: Transcription scoring
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run pytest -q -s tests/test_transcribe.py
