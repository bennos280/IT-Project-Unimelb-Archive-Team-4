# A version tag pushed (git tag v0.1.0 && git push origin v0.1.0) makes a GitHub release: PrestCribe.zip (the code at that tag,
# with the frontend built, so no Node is needed), install.ps1 and install.sh, which install it on Windows and Mac from the latest release, and each series' setup
# in setups/ (a PrestCribe file to open from Import).
# No database: an install starts empty (made on first run). ponytail: tests/ is left out (its labelled pages are 545 MB), so retraining page sorting needs a full checkout; ship those
# pages as their own download when an installed copy retrains.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Zip the code and the built frontend
        run: |
          git archive --format=zip --output=PrestCribe.zip HEAD -- . ':(exclude)tests'
          zip -qr PrestCribe.zip frontend/dist
          echo "$GITHUB_REF_NAME" > VERSION && zip -q PrestCribe.zip VERSION  # the version an installed copy knows it is
      - run: gh release create "$GITHUB_REF_NAME" PrestCribe.zip install.ps1 install.sh setups/*.prestcribe --title "PrestCribe $GITHUB_REF_NAME" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
