# Database migrations (Alembic). Bring the db up to date: uv run alembic upgrade head
# After changing backend/db/models.py: uv run alembic revision --autogenerate -m "what changed", check the new file, then upgrade.
[alembic]
script_location = %(here)s/backend/db/migrations
prepend_sys_path = .
path_separator = os
