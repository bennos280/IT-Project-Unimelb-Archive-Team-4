[project]
name = "prest-survey-digitisation"
version = "0.1.0"
description = "Team 4: digitising the 1940s University of Melbourne social survey cards"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=12",
    "numpy>=2",
    "pymupdf>=1.26",
    "scikit-learn>=1.6",
    "pytest>=9",
    "opencv-python-headless>=5.0.0.93",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.1",
    "pydantic>=2.13.5",
    "alembic>=1.20.0",
    "filelock>=3.32.6",
    "httpx2>=2.15.1",
]

[project.optional-dependencies]
# page sorting on this computer (about 2 GB), installed from Settings or with uv sync --extra local-sorting; none is built for
# Intel Macs, which sort pages with the reading model instead
local-sorting = [
    "torch>=2.9; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "transformers>=4.50; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[project.scripts]
survey = "backend.pipeline.run:main"
app = "backend.serve:main"
api = "backend.serve:api"
worker = "backend.worker:main"
prestcribe = "backend.serve:installed"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# torch: CUDA on Windows, CPU on Linux
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
